[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeguard"
version = "0.1.0"
description = "Local-first data quality checks for CSV and Parquet"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent"]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "typer>=0.12", "pydantic>=2", "PyYAML>=6", "Jinja2>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lakeguard = "lakeguard.cli:app"

[tool.setuptools.package-data]
lakeguard = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

